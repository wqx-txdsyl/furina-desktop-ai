name: Phase 13 R1.2 Exact-SHA Audit

on:
  push:
    branches:
      - audit/phase13-r12-9b075a6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      FURINA_AUDIT_SHA: 9b075a61ca8f4b0fd4058dbe769f009d93286d9b

    steps:
      - name: Checkout exact Phase 13 R1.2 SHA
        uses: actions/checkout@v4
        with:
          ref: 9b075a61ca8f4b0fd4058dbe769f009d93286d9b
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify exact SHA
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "EXPECTED_SHA=$env:FURINA_AUDIT_SHA"
          Write-Host "CHECKED_OUT_SHA=$actual"
          if ($actual -ne $env:FURINA_AUDIT_SHA) { throw "Exact SHA mismatch" }

      - name: Install runtime and audit dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-qt pywin32

      - name: Selfcheck
        shell: pwsh
        run: python main.py --selfcheck

      - name: R1.2 dialogue closure tests
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_phase13_r12_final_dialogue.py `
            tests/test_phase13_r11_residuals.py `
            tests/test_dialogue_liveness.py

      - name: Full technical regression run 1
        shell: pwsh
        run: python -m pytest -q --disable-warnings --maxfail=1

      - name: Full technical regression run 2
        shell: pwsh
        run: python -m pytest -q --disable-warnings --maxfail=1

      - name: Full technical regression run 3
        shell: pwsh
        run: python -m pytest -q --disable-warnings --maxfail=1

      - name: Qt offscreen GUI smoke
        if: always()
        shell: pwsh
        run: python main.py --smoke
