name: Manual A Audit

on:
  push:
    branches:
      - audit/manual-a-0402e7f
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-a:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      FURINA_MANUAL_BASELINE: 0402e7f1236cbc681e92c7ed7feca19ce5826618

    steps:
      - name: Checkout exact frozen backend baseline
        uses: actions/checkout@v4
        with:
          ref: 0402e7f1236cbc681e92c7ed7feca19ce5826618
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify frozen SHA
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "MANUAL_A_BASELINE=$env:FURINA_MANUAL_BASELINE"
          Write-Host "CHECKED_OUT_SHA=$actual"
          if ($actual -ne $env:FURINA_MANUAL_BASELINE) { throw "Frozen baseline mismatch" }

      - name: Install runtime and audit dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-qt pywin32

      - name: Frozen selfcheck
        shell: pwsh
        run: python main.py --selfcheck

      - name: Full technical regression on frozen SHA
        shell: pwsh
        run: python -m pytest -q --disable-warnings --maxfail=1

      - name: Manual-A scenario evidence subset
        if: always()
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_phase13_premanual.py `
            tests/test_phase13_fallback_presence.py `
            tests/test_phase13_gate.py `
            tests/test_phase13_final.py `
            tests/test_phase13_final2.py `
            tests/test_phase13_final3.py `
            tests/test_phase13_final4.py `
            tests/test_phase13_final5.py `
            tests/test_closeout_r1.py `
            tests/test_feeding.py `
            tests/test_memory_phase.py `
            tests/test_gui_integration.py `
            tests/test_embodiment.py `
            tests/test_agent_tools.py `
            tests/test_personality.py

      - name: Qt offscreen GUI smoke
        if: always()
        shell: pwsh
        run: python main.py --smoke
