[project]
name = "furina-desktop-companion"
version = "0.1.0"
description = "芙宁娜 AI 数字生命 Runtime — 一个真正生活在 Windows 桌面上的 AI 桌宠"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2",
    "httpx>=0.27",
    "pillow>=10",
    "numpy>=1.26",
    "aiohttp>=3.9",
    # Phase 14 R6–R12（R12）：Office 文档能力（docx.create / pptx.create / xlsx.create 及
    # document planning/execution）的 production 运行时依赖 —— 由
    # furina/agent/capabilities/documents/__init__.py 直接 import，必须声明在项目元数据。
    "python-docx>=0.8.11",
    "python-pptx>=0.6.18",
    "openpyxl>=3.0.7",
    # Phase 15 D4：IANA 时区数据库（Windows 官方数据提供方；zoneinfo 在无系统
    # tz 数据的环境依赖它解析 "Asia/Shanghai" 等键）—— 确定性时间语义的前提。
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "black", "ruff"]
# Windows 原生 UI Automation / 窗口枚举
win = ["pywin32>=306"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
